<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Notas de voz</title>
<meta name="theme-color" content="#0c0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notas voz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Bricolage";src:url(bricolage.woff2) format("woff2");font-weight:400 800;font-display:swap}
:root{--bg:#0c0c0f;--panel:#141419;--row:#17171d;--soft:#1d1d24;--line:#26262e;--ink:#fff;--muted:#8b8b98;--danger:#ff4f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 "Bricolage",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(130px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{display:block}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
.cir{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.cir svg{width:24px;height:24px}
h1{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1;margin:16px 18px 4px}
.sub{margin:0 18px 14px;color:var(--muted);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.sub i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2))}
.search{margin:0 14px 12px;display:none}
.search.show{display:block}
.search input{width:100%;background:var(--row);border:1.5px solid var(--line);border-radius:18px;padding:13px 16px;outline:none;font-size:17px}
.search input:focus{border-color:#fff}
/* big gradient block */
.blk{margin:0 14px 10px;border-radius:26px;padding:15px 16px 13px;background:linear-gradient(135deg,var(--c),var(--c2));position:relative;overflow:hidden;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:.6}}
.blk .r{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.blk .t{font-size:22px;font-weight:800;line-height:1.08;letter-spacing:-.015em;word-break:break-word}
.blk .t.empty{opacity:.75}
.blk .tg{font-size:12.5px;font-weight:700;background:rgba(0,0,0,.22);padding:5px 11px;border-radius:999px;white-space:nowrap}
.blk .b{display:flex;align-items:center;gap:12px;margin-top:13px}
.blk .pp{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:#0c0c0f}
.blk .pp svg{width:22px;height:22px}
.wave{flex:1;height:40px;position:relative;touch-action:none}
.wave>div{position:absolute;inset:0}
.wave svg{width:100%;height:100%}
.wave .hi{clip-path:inset(0 100% 0 0)}
.wave .lo{opacity:.38}
.blk .f{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.blk .m{font-size:14px;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.blk .dots{width:34px;height:28px;display:grid;place-items:center;border-radius:14px;background:rgba(0,0,0,.18)}
.blk .dots svg{width:18px;height:18px}
/* mini rows */
.mini{margin:0 14px 10px;border-radius:22px;padding:12px 8px 12px 14px;background:var(--row);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.mini:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--c),var(--c2))}
.mini .pp{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));display:grid;place-items:center;flex:none;color:#0c0c0f;margin-left:4px}
.mini .pp svg{width:18px;height:18px}
.mini .t{font-weight:650;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t.empty{color:var(--muted)}
.mini .m{color:var(--muted);font-size:13px;text-align:right;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini .dots{width:32px;height:40px;display:grid;place-items:center;color:var(--muted)}
.mini .dots svg{width:18px;height:18px}
.empty-state{text-align:center;color:var(--muted);padding:70px 30px;font-size:17px}
.empty-state b{display:block;color:#fff;font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
/* record button */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:20px 0 calc(22px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 55%,transparent);pointer-events:none;z-index:5}
.fab{pointer-events:auto;width:82px;height:82px;border-radius:50%;background:#fff;color:#0c0c0f;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.12);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab svg{width:34px;height:34px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:10}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(310px,82vw);background:var(--panel);z-index:11;transform:translateX(-102%);transition:transform .25s ease;
  padding:calc(30px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.drawer.show{transform:none}
.drawer h2{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:16px 4px 18px}
.drow{display:flex;width:100%;align-items:center;gap:12px;padding:14px;border-radius:18px;font-size:19px;font-weight:650;margin-bottom:4px;text-align:left}
.drow.on{background:#fff;color:#0c0c0f}
.drow i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));flex:none}
.drow span{margin-left:auto;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.drow.on span{color:#555}
.dlink{display:block;width:100%;text-align:left;padding:13px 14px;color:var(--muted);font-size:17px;font-weight:650}
.dsep{height:1px;background:var(--line);margin:14px 4px}
/* sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--panel);border-radius:28px 28px 0 0;max-width:560px;margin:0 auto;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s ease;max-height:90vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#33333d;margin:0 auto 16px}
.sheet h3{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.recstate{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:700;color:#ff5a6e;font-size:15px}
.recstate i{width:10px;height:10px;border-radius:50%;background:#ff5a6e;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.timer{text-align:center;font-size:64px;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0 6px}
canvas.live{width:100%;height:90px;display:block}
.stop{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:18px auto 6px}
.stop i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ff8a1f,#ff3d5a)}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:16px;border-radius:18px;font-weight:750;text-align:center;background:var(--soft);font-size:17px}
.btn.primary{background:#fff;color:#0c0c0f}
.btn.danger{color:var(--danger)}
.lbl{display:block;font-size:14px;color:var(--muted);font-weight:700;margin:16px 0 8px}
.field{width:100%;background:var(--row);border:1.5px solid var(--line);border-radius:16px;padding:14px;outline:none;font-size:17px}
.field:focus{border-color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--soft);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.chip i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2))}
.chip.on{background:linear-gradient(135deg,var(--c),var(--c2))}
.chip.on i{background:#fff}
.menu button{display:flex;width:100%;align-items:center;gap:14px;padding:16px 4px;font-size:18px;font-weight:650;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu svg{width:22px;height:22px;color:var(--muted)}
.tagrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tagrow .field{flex:1;padding:12px 14px}
.sw{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--c),var(--c2))}
.del{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--danger);background:var(--soft);flex:none}
.grads{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px 50px}
.grads button{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2))}
.hint{color:var(--muted);font-size:15px;margin:0}
.stat{color:var(--muted);font-size:14px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(124px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#fff;color:#0c0c0f;padding:11px 18px;border-radius:16px;font-weight:700;font-size:15px;opacity:0;transition:.22s;z-index:30;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="cir" id="menuBtn" aria-label="Etiquetas"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button class="cir" id="searchBtn" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>
  <h1>Notas de voz</h1>
  <div class="sub" id="sub"></div>
  <div class="search" id="searchBox"><input id="q" type="search" placeholder="Buscar por título" autocomplete="off" enterkeyhint="search"></div>
  <main id="list"></main>
</div>
<div class="dock"><button class="fab" id="recBtn" aria-label="Grabar"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>

<div class="scrim" id="scrim"></div>

<nav class="drawer" id="drawer">
  <h2>Etiquetas</h2>
  <div id="drawerTags"></div>
  <div class="dsep"></div>
  <button class="dlink" id="dNew">+ Nueva etiqueta</button>
  <button class="dlink" id="dEdit">Editar etiquetas</button>
  <button class="dlink" id="dBackup">Copia de seguridad</button>
</nav>

<div class="sheet" id="recSheet">
  <div class="grab"></div>
  <div class="recstate"><i></i>Grabando</div>
  <div class="timer" id="timer">0:00</div>
  <canvas class="live" id="live"></canvas>
  <button class="stop" id="stopBtn" aria-label="Parar"><i></i></button>
  <div class="row"><button class="btn danger" id="cancelRec">Descartar</button></div>
</div>

<div class="sheet" id="saveSheet">
  <div class="grab"></div>
  <h3 id="saveTitle">Guardar nota</h3>
  <label class="lbl">Etiqueta</label>
  <div class="chips" id="tagPick"></div>
  <label class="lbl" for="titleIn">Título (opcional)</label>
  <input class="field" id="titleIn" placeholder="Ej.: reel del mercado de Bandim" maxlength="120" enterkeyhint="done">
  <div class="row"><button class="btn" id="saveCancel">Descartar</button><button class="btn primary" id="saveOk">Guardar</button></div>
</div>

<div class="sheet" id="menuSheet">
  <div class="grab"></div>
  <div class="menu">
    <button id="mEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Editar título y etiqueta</button>
    <button id="mShare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Compartir o guardar el audio</button>
    <button id="mDel" style="color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--danger)"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Borrar</button>
  </div>
</div>

<div class="sheet" id="tagSheet">
  <div class="grab"></div>
  <h3>Editar etiquetas</h3>
  <div id="tagEdit"></div>
  <div class="row"><button class="btn" id="addTag">+ Nueva</button><button class="btn primary" id="tagClose">Listo</button></div>
</div>

<div class="sheet" id="bkSheet">
  <div class="grab"></div>
  <h3>Copia de seguridad</h3>
  <p class="hint">Las notas se guardan solo en este iPhone: si borras la app, se pierden. Haz una copia de vez en cuando y guárdala en Archivos, Drive o mándatela por WhatsApp.</p>
  <div class="row"><button class="btn primary" id="exportBtn">Hacer copia</button><button class="btn" id="importBtn">Restaurar</button></div>
  <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
  <div class="stat" id="stat"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const GRADS=[["#4f7cff","#00c2ff"],["#c04bff","#ff4fa3"],["#19d38a","#b7f03a"],["#ff8a1f","#ff3d5a"],["#ff3d8b","#ffb03a"],["#00d1c1","#4f7cff"],["#ffd23f","#ff7a1f"],["#8a5cff","#3dd6ff"]];
const DEFAULT_TAGS=[
  {id:"tfg",name:"TFG",c:GRADS[0][0],c2:GRADS[0][1]},
  {id:"video",name:"Vídeo",c:GRADS[1][0],c2:GRADS[1][1]},
  {id:"compra",name:"Compra",c:GRADS[2][0],c2:GRADS[2][1]},
  {id:"contenido",name:"Contenido",c:GRADS[3][0],c2:GRADS[3][1]}
];
const NOTAG={id:"",name:"Sin etiqueta",c:"#6b6b78",c2:"#9a9aa8"};
const BARS=44;
const $=s=>document.querySelector(s);
let tags=[],notes=[],filter="all",query="",editing=null,pending=null,lastTag=null;

/* ---------- IndexedDB ---------- */
let dbp;
function db(){
  if(!dbp) dbp=new Promise((res,rej)=>{
    const r=indexedDB.open("notas-voz",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("notes",{keyPath:"id"});d.createObjectStore("kv");};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode),s=t.objectStore(store);let out;
    const r=fn(s);if(r) r.onsuccess=()=>{out=r.result};
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const getAll=()=>tx("notes","readonly",s=>s.getAll());
const putNote=n=>tx("notes","readwrite",s=>s.put(n));
const delNote=id=>tx("notes","readwrite",s=>s.delete(id));
const kvGet=k=>tx("kv","readonly",s=>s.get(k));
const kvSet=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));

/* ---------- utils ---------- */
const fmt=s=>{s=Math.max(0,Math.floor(s+.001));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const fmtDate=ts=>{const d=new Date(ts);return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tagOf=id=>tags.find(t=>t.id===id)||NOTAG;
const gstyle=t=>`--c:${t.c};--c2:${t.c2}`;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600);}
function extFor(m){return /mp4|aac|m4a/.test(m)?"m4a":/ogg/.test(m)?"ogg":/webm/.test(m)?"webm":"audio";}
function slug(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"nota";}
function resample(arr,n){
  if(!arr||!arr.length) return null;const out=[];
  for(let i=0;i<n;i++){const a=Math.floor(i*arr.length/n),b=Math.max(a+1,Math.floor((i+1)*arr.length/n));let m=0;for(let j=a;j<b&&j<arr.length;j++)m=Math.max(m,arr[j]);out.push(m);}
  const mx=Math.max(...out,.01);return out.map(v=>Math.round((.12+.88*Math.sqrt(Math.min(1,v/mx)))*100)/100);
}
function fakePeaks(id){let s=0;for(const c of id)s=(s*31+c.charCodeAt(0))%9973;const o=[];for(let i=0;i<BARS;i++){s=(s*9301+49297)%233280;o.push(.25+.75*Math.abs(Math.sin(i*.5+s%7))*(.5+.5*s/233280));}return o;}
function waveSVG(peaks){
  const w=BARS*6,h=40;let r="";
  peaks.forEach((v,i)=>{const bh=Math.max(4,v*h);r+=`<rect x="${i*6}" y="${((h-bh)/2).toFixed(1)}" width="3.4" height="${bh.toFixed(1)}" rx="1.7"/>`;});
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" fill="#fff">${r}</svg>`;
}

/* ---------- overlays ---------- */
let open=null;
function show(id){if(open)open.classList.remove("show");open=$(id);const el=open;$("#scrim").classList.add("show");requestAnimationFrame(()=>el.classList.add("show"));}
function hide(){if(open)open.classList.remove("show");open=null;$("#scrim").classList.remove("show");document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}
$("#scrim").onclick=()=>{if(!open)return;if(open.id==="recSheet")return;if(open.id==="saveSheet"&&pending)return;hide();};

/* ---------- render ---------- */
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>';
const ICON_DOTS='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>';
function visible(){
  let l=notes.slice().sort((a,b)=>b.created-a.created);
  if(filter!=="all") l=l.filter(n=>filter===""?!tags.some(t=>t.id===n.tag):n.tag===filter);
  if(query){const q=slug(query);l=l.filter(n=>slug(n.title||"").includes(q)||slug(tagOf(n.tag).name).includes(q));}
  return l;
}
function render(){
  const ft=filter==="all"?null:filter===""?NOTAG:tagOf(filter);
  $("#sub").innerHTML=ft?`<i style="${gstyle(ft)}"></i>${esc(ft.name)}`:"Todas";
  renderDrawer();
  const list=visible();
  if(!list.length){
    $("#list").innerHTML=notes.length?`<div class="empty-state"><b>Nada por aquí</b>No hay notas con este filtro.</div>`
      :`<div class="empty-state"><b>Tu primera idea</b>Toca el micro, habla y elige una etiqueta.</div>`;
    return;
  }
  $("#list").innerHTML=list.map((n,i)=>{
    const t=tagOf(n.tag),playing=player.id===n.id,isP=playing&&!audio.paused;
    const title=n.title?esc(n.title):"Nota sin título";
    if(i<2||playing){
      const w=waveSVG(n.peaks||fakePeaks(n.id));
      return `<div class="blk" style="${gstyle(t)}" data-id="${n.id}">
        <div class="r"><div class="t ${n.title?"":"empty"}">${title}</div><div class="tg">${esc(t.name)}</div></div>
        <div class="b"><button class="pp" data-act="play" aria-label="Reproducir">${isP?ICON_PAUSE:ICON_PLAY}</button>
          <div class="wave"><div class="lo">${w}</div><div class="hi">${w}</div></div></div>
        <div class="f"><button class="dots" data-act="more" aria-label="Opciones">${ICON_DOTS}</button><div class="m">${fmtDate(n.created)} · <span class="tm">${playing?fmt(audio.currentTime)+" / ":""}${fmt(n.duration)}</span></div></div>
      </div>`;
    }
    return `<div class="mini" style="${gstyle(t)}" data-id="${n.id}">
      <button class="pp" data-act="play" aria-label="Reproducir">${ICON_PLAY}</button>
      <div class="t ${n.title?"":"empty"}">${title}</div>
      <div class="m">${fmtDate(n.created)}<br>${fmt(n.duration)}</div>
      <button class="dots" data-act="more" aria-label="Opciones">${ICON_DOTS}</button>
    </div>`;
  }).join("");
  paintProgress();
}
function renderDrawer(){
  const counts={};notes.forEach(n=>counts[n.tag]=(counts[n.tag]||0)+1);
  let h=`<button class="drow ${filter==="all"?"on":""}" data-f="all">Todas<span>${notes.length}</span></button>`;
  for(const t of tags) h+=`<button class="drow ${filter===t.id?"on":""}" style="${gstyle(t)}" data-f="${t.id}"><i></i>${esc(t.name)}<span>${counts[t.id]||0}</span></button>`;
  const orphan=notes.filter(n=>!tags.some(t=>t.id===n.tag)).length;
  if(orphan) h+=`<button class="drow ${filter===""?"on":""}" style="${gstyle(NOTAG)}" data-f=""><i></i>Sin etiqueta<span>${orphan}</span></button>`;
  $("#drawerTags").innerHTML=h;
}
$("#menuBtn").onclick=()=>{renderDrawer();show("#drawer");};
$("#drawerTags").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;hide();render();window.scrollTo({top:0});};
$("#searchBtn").onclick=()=>{const s=$("#searchBox");s.classList.toggle("show");if(s.classList.contains("show"))$("#q").focus();else{$("#q").value="";query="";render();}};
$("#q").oninput=e=>{query=e.target.value.trim();render();};

/* ---------- playback (smooth progress with rAF) ---------- */
const audio=new Audio();audio.preload="auto";
const player={id:null,url:null};let praf=null;
function stopPlayer(){audio.pause();cancelAnimationFrame(praf);if(player.url)URL.revokeObjectURL(player.url);player.id=null;player.url=null;}
function durOf(n){return isFinite(audio.duration)&&audio.duration>0?audio.duration:n.duration;}
function paintProgress(){
  if(!player.id) return;
  const el=document.querySelector(`.blk[data-id="${player.id}"]`);const n=notes.find(x=>x.id===player.id);if(!el||!n)return;
  const p=Math.min(1,audio.currentTime/durOf(n));
  el.querySelector(".hi").style.clipPath=`inset(0 ${(100-p*100).toFixed(2)}% 0 0)`;
  el.querySelector(".tm").textContent=fmt(audio.currentTime)+" / "+fmt(n.duration);
}
function loop(){paintProgress();if(!audio.paused)praf=requestAnimationFrame(loop);}
async function togglePlay(id){
  if(player.id===id){if(audio.paused)audio.play().catch(()=>{});else audio.pause();return;}
  stopPlayer();
  const n=notes.find(x=>x.id===id);if(!n)return;
  player.id=id;player.url=URL.createObjectURL(new Blob([n.audio],{type:n.mime||"audio/mp4"}));audio.src=player.url;
  render();
  try{await audio.play();}catch(e){toast("No se pudo reproducir el audio");}
}
audio.onplay=()=>{updateBtn();cancelAnimationFrame(praf);loop();};
audio.onpause=()=>{updateBtn();paintProgress();};
audio.onended=()=>{stopPlayer();render();};
function updateBtn(){const el=document.querySelector(`.blk[data-id="${player.id}"] .pp`);if(el)el.innerHTML=audio.paused?ICON_PLAY:ICON_PAUSE;}
function seekFrom(e,wave){
  const id=wave.closest("[data-id]").dataset.id;
  const r=wave.getBoundingClientRect(),n=notes.find(x=>x.id===id),d=durOf(n);
  audio.currentTime=Math.max(0,Math.min(d-.05,(e.clientX-r.left)/r.width*d));paintProgress();
}
$("#list").addEventListener("pointerdown",e=>{
  const w=e.target.closest(".wave");if(!w)return;
  const id=w.closest("[data-id]").dataset.id;
  if(player.id!==id)return; // tap on a non-playing wave falls through to click → play
  e.preventDefault();seekFrom(e,w);
  const mv=ev=>{if(player.id===id)seekFrom(ev,w);};
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
});
$("#list").addEventListener("click",e=>{
  const card=e.target.closest("[data-id]");if(!card)return;const id=card.dataset.id;
  if(e.target.closest(".wave")&&player.id===id)return;
  const b=e.target.closest("[data-act]");
  if(b&&b.dataset.act==="more"){editing=id;show("#menuSheet");return;}
  togglePlay(id);
});

/* ---------- recording ---------- */
let rec=null,stream=null,chunks=[],t0=0,tick=null,actx=null,analyser=null,raf=null,cancelled=false,levels=[],allLevels=[];
function pickMime(){
  for(const m of ["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/aac","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"])
    if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)) return m;
  return "";
}
async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("Este navegador no permite grabar. Actualiza iOS.");return;}
  stopPlayer();render();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){toast("Sin permiso de micrófono. Actívalo en Ajustes › Safari › Micrófono.");return;}
  const mime=pickMime();
  try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){rec=new MediaRecorder(stream);}
  chunks=[];cancelled=false;levels=[];allLevels=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=onRecStop;rec.start(1000);
  t0=Date.now();$("#timer").textContent="0:00";
  tick=setInterval(()=>{$("#timer").textContent=fmt((Date.now()-t0)/1000);},200);
  show("#recSheet");
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaStreamSource(stream);analyser=actx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);
    drawLive();
  }catch(e){}
}
function drawLive(){
  const c=$("#live"),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const buf=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(buf);
  let sum=0;for(const v of buf){const x=(v-128)/128;sum+=x*x;}
  const lv=Math.min(1,Math.sqrt(sum/buf.length)*4.5);levels.push(lv);allLevels.push(lv);
  const bw=4,gap=3,n=Math.floor(w/(bw+gap));while(levels.length>n)levels.shift();
  const grad=g.createLinearGradient(0,0,w,0);grad.addColorStop(0,"#ff8a1f");grad.addColorStop(1,"#ff3d5a");g.fillStyle=grad;
  levels.forEach((l,i)=>{const bh=Math.max(4,Math.sqrt(l)*h);const x=w-(levels.length-i)*(bw+gap);g.beginPath();
    if(g.roundRect)g.roundRect(x,(h-bh)/2,bw,bh,2);else g.rect(x,(h-bh)/2,bw,bh);g.fill();});
  raf=requestAnimationFrame(drawLive);
}
function cleanupRec(){clearInterval(tick);cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(actx){actx.close().catch(()=>{});actx=null;}}
function stopRec(cancel){if(!rec)return;cancelled=!!cancel;pending={duration:(Date.now()-t0)/1000,peaks:resample(allLevels,BARS)};if(rec.state!=="inactive")rec.stop();else onRecStop();}
async function onRecStop(){
  const r=rec;rec=null;cleanupRec();
  if(cancelled){pending=null;hide();return;}
  const mime=(r&&r.mimeType)||(chunks[0]&&chunks[0].type)||"audio/mp4";
  const blob=new Blob(chunks,{type:mime});chunks=[];
  if(!blob.size||pending.duration<.5){pending=null;hide();toast("Demasiado corta, no se ha guardado");return;}
  pending.mime=mime.split(";")[0];pending.audio=await blob.arrayBuffer();
  openSave(null);
}
$("#recBtn").onclick=startRec;
$("#stopBtn").onclick=()=>stopRec(false);
$("#cancelRec").onclick=()=>stopRec(true);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&rec)stopRec(false);});

/* ---------- save / edit ---------- */
let pickTag=null;
function renderTagPick(){$("#tagPick").innerHTML=tags.map(t=>`<button class="chip ${pickTag===t.id?"on":""}" style="${gstyle(t)}" data-t="${t.id}"><i></i>${esc(t.name)}</button>`).join("");}
$("#tagPick").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;pickTag=b.dataset.t;renderTagPick();};
function openSave(id){
  editing=id;const n=id?notes.find(x=>x.id===id):null;
  pickTag=n?n.tag:(filter!=="all"&&filter?filter:(lastTag&&tags.some(t=>t.id===lastTag)?lastTag:(tags[0]&&tags[0].id)));
  $("#titleIn").value=n?(n.title||""):"";
  $("#saveTitle").textContent=n?"Editar nota":"Guardar nota";
  $("#saveCancel").textContent=n?"Cancelar":"Descartar";
  renderTagPick();show("#saveSheet");
}
$("#saveOk").onclick=async()=>{
  const title=$("#titleIn").value.trim();
  if(editing){const n=notes.find(x=>x.id===editing);n.tag=pickTag;n.title=title;await putNote(n);}
  else if(pending){
    const n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:Date.now(),duration:pending.duration,
      tag:pickTag,title,mime:pending.mime,audio:pending.audio,peaks:pending.peaks};
    try{await putNote(n);notes.push(n);}catch(e){toast("No se pudo guardar: ¿memoria llena?");return;}
    lastTag=pickTag;kvSet("lastTag",lastTag);pending=null;toast("Nota guardada");
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }
  editing=null;hide();render();
};
$("#saveCancel").onclick=()=>{if(!editing&&pending){if(!confirm("¿Descartar esta grabación?"))return;pending=null;}editing=null;hide();};
$("#titleIn").onkeydown=e=>{if(e.key==="Enter")$("#saveOk").click();};

/* ---------- note menu ---------- */
$("#mEdit").onclick=()=>openSave(editing);
$("#mDel").onclick=async()=>{
  const id=editing;hide();if(!confirm("¿Borrar esta nota? No se puede deshacer."))return;
  if(player.id===id)stopPlayer();await delNote(id);notes=notes.filter(n=>n.id!==id);render();toast("Nota borrada");
};
$("#mShare").onclick=async()=>{
  const n=notes.find(x=>x.id===editing);hide();if(!n)return;
  const d=new Date(n.created);const name=`${d.toISOString().slice(0,10)}-${slug(n.title||tagOf(n.tag).name)}.${extFor(n.mime)}`;
  await shareOrDownload(new File([n.audio],name,{type:n.mime}),n.title||"Nota de voz");
};
async function shareOrDownload(file,title){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title});return true;}catch(e){if(e.name==="AbortError")return false;}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return true;
}

/* ---------- tags ---------- */
let gradOpen=null;
function renderTagEdit(){
  $("#tagEdit").innerHTML=tags.map(t=>`<div class="tagrow" data-id="${t.id}">
    <button class="sw" style="${gstyle(t)}" data-act="grad" aria-label="Color"></button>
    <input type="text" class="field" value="${esc(t.name)}" maxlength="24" data-act="name">
    <button class="del" data-act="del" aria-label="Borrar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>${gradOpen===t.id?`<div class="grads" data-id="${t.id}">${GRADS.map((g,i)=>`<button style="--c:${g[0]};--c2:${g[1]}" data-g="${i}"></button>`).join("")}</div>`:""}`).join("");
}
async function saveTags(){await kvSet("tags",tags);render();}
$("#tagEdit").addEventListener("click",e=>{
  const g=e.target.closest("[data-g]");
  if(g){const t=tags.find(x=>x.id===g.parentNode.dataset.id);[t.c,t.c2]=GRADS[+g.dataset.g];gradOpen=null;renderTagEdit();saveTags();return;}
  const b=e.target.closest("[data-act]");if(!b)return;const id=b.closest(".tagrow").dataset.id;
  if(b.dataset.act==="grad"){gradOpen=gradOpen===id?null:id;renderTagEdit();}
  if(b.dataset.act==="del"){
    const used=notes.filter(n=>n.tag===id).length;
    if(!confirm(used?`Hay ${used} nota(s) con esta etiqueta. Se quedarán «Sin etiqueta». ¿Borrarla?`:"¿Borrar esta etiqueta?"))return;
    tags=tags.filter(t=>t.id!==id);if(filter===id)filter="all";renderTagEdit();saveTags();
  }
});
$("#tagEdit").addEventListener("change",e=>{
  if(e.target.dataset.act!=="name")return;const id=e.target.closest(".tagrow").dataset.id;
  const v=e.target.value.trim();if(!v){renderTagEdit();return;}tags.find(t=>t.id===id).name=v;saveTags();
});
function addTag(){
  const used=new Set(tags.map(t=>t.c));const g=GRADS.find(x=>!used.has(x[0]))||GRADS[tags.length%GRADS.length];
  const t={id:"t"+Date.now().toString(36),name:"Nueva",c:g[0],c2:g[1]};tags.push(t);gradOpen=null;renderTagEdit();saveTags();
  const inp=document.querySelector(`.tagrow[data-id="${t.id}"] input`);inp.focus();inp.select();
}
$("#addTag").onclick=addTag;
$("#tagClose").onclick=()=>hide();
$("#dEdit").onclick=()=>{gradOpen=null;renderTagEdit();show("#tagSheet");};
$("#dNew").onclick=()=>{gradOpen=null;renderTagEdit();show("#tagSheet");addTag();};

/* ---------- backup ---------- */
async function updateStat(){
  const bytes=notes.reduce((a,n)=>a+(n.audio?n.audio.byteLength:0),0);
  let s=`${notes.length} ${notes.length===1?"nota":"notas"} · ${(bytes/1048576).toFixed(1)} MB.`;
  const lb=await kvGet("lastBackup");s+=lb?` Última copia: ${fmtDate(lb)}.`:" Aún no has hecho ninguna copia.";
  $("#stat").textContent=s;
}
$("#dBackup").onclick=()=>{updateStat();show("#bkSheet");};
function abToB64(ab){const u=new Uint8Array(ab);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64ToAb(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
$("#exportBtn").onclick=async()=>{
  if(!notes.length){toast("No hay notas que copiar");return;}
  const data={app:"notas-voz",version:2,exported:new Date().toISOString(),tags,
    notes:notes.map(n=>({id:n.id,created:n.created,duration:n.duration,tag:n.tag,title:n.title,mime:n.mime,peaks:n.peaks||null,audio:abToB64(n.audio)}))};
  const file=new File([JSON.stringify(data)],`notas-voz-copia-${new Date().toISOString().slice(0,10)}.json`,{type:"application/json"});
  if(await shareOrDownload(file,"Copia de Notas de voz")){await kvSet("lastBackup",Date.now());updateStat();toast("Copia lista");}
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let data;try{data=JSON.parse(await f.text());}catch(err){toast("Ese archivo no es una copia válida");return;}
  if(!data||data.app!=="notas-voz"||!Array.isArray(data.notes)){toast("Ese archivo no es una copia de Notas de voz");return;}
  for(const t of data.tags||[]){if(!t.c){const d=DEFAULT_TAGS.find(x=>x.id===t.id)||{c:t.color||"#6b6b78",c2:t.color||"#9a9aa8"};t.c=d.c;t.c2=d.c2;delete t.color;}if(!tags.some(x=>x.id===t.id))tags.push(t);}
  await kvSet("tags",tags);
  let added=0;
  for(const n of data.notes){if(notes.some(x=>x.id===n.id))continue;const note={...n,audio:b64ToAb(n.audio)};await putNote(note);notes.push(note);added++;}
  render();updateStat();toast(added?`Restauradas ${added} notas`:"Ya tenías todas esas notas");
};

/* ---------- init ---------- */
(async()=>{
  try{
    tags=(await kvGet("tags"))||DEFAULT_TAGS.map(t=>({...t}));
    let mig=false;tags.forEach((t,i)=>{if(!t.c){const d=DEFAULT_TAGS.find(x=>x.id===t.id);const g=d?[d.c,d.c2]:GRADS[i%GRADS.length];t.c=g[0];t.c2=g[1];delete t.color;mig=true;}});
    if(mig)kvSet("tags",tags);
    lastTag=await kvGet("lastTag");
    notes=(await getAll())||[];
  }catch(e){toast("No se pudo abrir el almacenamiento");tags=DEFAULT_TAGS.map(t=>({...t}));}
  render();
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
</script>
