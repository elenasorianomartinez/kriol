<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Notas de voz</title>
<meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notas voz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#faf6f1;--card:#ffffff;--ink:#221d18;--muted:#80776d;--line:#ece4d9;
  --brand:#e2583e;--brand-ink:#fff;--soft:#f3ece3;--shadow:0 1px 2px rgba(60,40,20,.06),0 4px 16px rgba(60,40,20,.06);
  --danger:#c93a3a;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#16130f;--card:#211c17;--ink:#f3eee8;--muted:#a59b90;--line:#332b24;--soft:#2a241e;
    --brand:#f06a4f;--shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(120px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:750}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.iconbtn svg{width:22px;height:22px}
.search{margin:12px 0 4px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px 10px 36px;outline:none}
.search input:focus{border-color:var(--brand)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:550;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.chip.on .dot{background:#fff}
.chip.on:not([style]){color:var(--bg)}
.chip .n{opacity:.6;font-weight:500}
.day{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.note{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 12px 12px 10px;margin-bottom:10px;
  display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;border-left:4px solid var(--c)}
.play{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.play svg{width:20px;height:20px}
.meta{min-width:0}
.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title.empty{color:var(--muted);font-weight:500}
.info{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:2px}
.tagpill{color:var(--c);font-weight:650}
.bar{grid-column:2/3;height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px;display:none;cursor:pointer;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--c)}
.note.playing .bar{display:block;height:6px}
.more{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.more svg{width:20px;height:20px}
.empty-state{text-align:center;color:var(--muted);padding:60px 20px}
.empty-state .big{font-size:44px;margin-bottom:8px}
.recdock{position:fixed;left:0;right:0;bottom:0;padding:14px 0 calc(18px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;background:linear-gradient(to top,var(--bg) 65%,transparent);pointer-events:none}
.recbtn{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(226,88,62,.4);transition:transform .15s}
.recbtn:active{transform:scale(.94)}
.recbtn svg{width:32px;height:32px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,14,8,.45);display:none;z-index:10}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;
  max-width:560px;margin:0 auto;max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;margin:0 0 12px}
.timer{font-size:52px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0}
canvas.wave{width:100%;height:70px;display:block}
.recstate{text-align:center;color:var(--brand);font-weight:600;font-size:14px;display:flex;gap:6px;justify-content:center;align-items:center}
.recstate .live{width:9px;height:9px;border-radius:50%;background:var(--brand);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:650;text-align:center;background:var(--soft)}
.btn.primary{background:var(--brand);color:#fff}
.btn.danger{color:var(--danger)}
.stopbtn{width:72px;height:72px;border-radius:50%;border:4px solid var(--brand);display:grid;place-items:center;margin:16px auto 4px}
.stopbtn i{width:26px;height:26px;border-radius:6px;background:var(--brand)}
label.lbl{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;outline:none}
.field:focus{border-color:var(--brand)}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.menu button{display:flex;width:100%;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.menu button:last-child{border-bottom:0}
.menu svg{width:22px;height:22px;color:var(--muted)}
.tagrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tagrow input[type=text]{flex:1}
.swatch{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.del{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--danger)}
.colors{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 10px 40px}
.colors button{width:26px;height:26px;border-radius:50%}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.stat{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Notas de voz</h1>
      <div class="sub" id="count"></div>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar por título" autocomplete="off">
  </div>
  <div class="chips" id="filters"></div>
  <main id="list"></main>
</div>

<div class="recdock"><button class="recbtn" id="recBtn" aria-label="Grabar">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button></div>

<div class="scrim" id="scrim"></div>

<!-- grabando -->
<div class="sheet" id="recSheet">
  <div class="grab"></div>
  <div class="recstate"><span class="live"></span><span id="recLabel">Grabando</span></div>
  <div class="timer" id="timer">0:00</div>
  <canvas class="wave" id="wave"></canvas>
  <button class="stopbtn" id="stopBtn" aria-label="Parar"><i></i></button>
  <div class="row"><button class="btn danger" id="cancelRec">Descartar</button></div>
</div>

<!-- guardar / editar -->
<div class="sheet" id="saveSheet">
  <div class="grab"></div>
  <h2 id="saveTitle">Guardar nota</h2>
  <label class="lbl">Etiqueta</label>
  <div class="tagpick" id="tagPick"></div>
  <label class="lbl" for="titleIn">Título (opcional)</label>
  <input class="field" id="titleIn" placeholder="Ej.: idea para el reel del mercado" maxlength="120" enterkeyhint="done">
  <div class="row">
    <button class="btn" id="saveCancel">Descartar</button>
    <button class="btn primary" id="saveOk">Guardar</button>
  </div>
</div>

<!-- menú de una nota -->
<div class="sheet" id="menuSheet">
  <div class="grab"></div>
  <div class="menu">
    <button id="mEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Editar título y etiqueta</button>
    <button id="mShare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Compartir o guardar el audio</button>
    <button id="mDel" style="color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--danger)"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Borrar</button>
  </div>
</div>

<!-- ajustes -->
<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h2>Etiquetas</h2>
  <div id="tagEdit"></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="addTag">+ Nueva etiqueta</button></div>
  <h2 style="margin-top:26px">Copia de seguridad</h2>
  <p class="hint">Las notas viven solo en este iPhone. Si borras la app, se pierden. Haz una copia de vez en cuando y guárdala en Archivos, Drive o mándatela por WhatsApp.</p>
  <div class="row">
    <button class="btn primary" id="exportBtn">Hacer copia</button>
    <button class="btn" id="importBtn">Restaurar copia</button>
  </div>
  <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
  <div class="stat" id="stat"></div>
  <div class="row"><button class="btn" id="setClose">Listo</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const PALETTE=["#3b6fd8","#8b5cf6","#1f9d55","#e08a00","#e2583e","#d6447f","#0e9aa7","#6b7280"];
const DEFAULT_TAGS=[
  {id:"tfg",name:"TFG",color:"#3b6fd8"},
  {id:"video",name:"Vídeo",color:"#8b5cf6"},
  {id:"compra",name:"Compra",color:"#1f9d55"},
  {id:"contenido",name:"Contenido",color:"#e08a00"}
];
const $=s=>document.querySelector(s);
let tags=[],notes=[],filter="all",query="",editing=null,pending=null,lastTag=null;

/* ---------- IndexedDB ---------- */
let dbp;
function db(){
  if(!dbp) dbp=new Promise((res,rej)=>{
    const r=indexedDB.open("notas-voz",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("notes",{keyPath:"id"});d.createObjectStore("kv");};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode),s=t.objectStore(store);let out;
    const r=fn(s);if(r) r.onsuccess=()=>{out=r.result};
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const getAll=()=>tx("notes","readonly",s=>s.getAll());
const putNote=n=>tx("notes","readwrite",s=>s.put(n));
const delNote=id=>tx("notes","readwrite",s=>s.delete(id));
const kvGet=k=>tx("kv","readonly",s=>s.get(k));
const kvSet=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));

/* ---------- utils ---------- */
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tagOf=id=>tags.find(t=>t.id===id)||{id:"",name:"Sin etiqueta",color:"#9a9088"};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600);}
function dayLabel(ts){
  const d=new Date(ts),n=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const diff=Math.round((b-a)/864e5);
  if(diff===0) return "Hoy";if(diff===1) return "Ayer";
  return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}
const hhmm=ts=>new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
function extFor(mime){return /mp4|aac|m4a/.test(mime)?"m4a":/ogg/.test(mime)?"ogg":/webm/.test(mime)?"webm":"audio";}
function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"nota";}

/* ---------- sheets ---------- */
let openSheet=null;
function show(id){if(openSheet) openSheet.classList.remove("show");openSheet=$(id);const s=openSheet;$("#scrim").classList.add("show");requestAnimationFrame(()=>s.classList.add("show"));}
function hide(){if(openSheet) openSheet.classList.remove("show");openSheet=null;$("#scrim").classList.remove("show");}
$("#scrim").onclick=()=>{if(openSheet&&openSheet.id==="recSheet") return; if(openSheet&&openSheet.id==="saveSheet"&&pending) return; hide();};

/* ---------- render ---------- */
function renderFilters(){
  const counts={};notes.forEach(n=>counts[n.tag]=(counts[n.tag]||0)+1);
  let h=`<button class="chip ${filter==="all"?"on":""}" data-f="all">Todas <span class="n">${notes.length}</span></button>`;
  for(const t of tags) h+=`<button class="chip ${filter===t.id?"on":""}" style="--c:${t.color}" data-f="${t.id}"><span class="dot"></span>${esc(t.name)} <span class="n">${counts[t.id]||0}</span></button>`;
  const orphan=notes.filter(n=>!tags.some(t=>t.id===n.tag)).length;
  if(orphan) h+=`<button class="chip ${filter===""?"on":""}" data-f=""><span class="dot"></span>Sin etiqueta <span class="n">${orphan}</span></button>`;
  $("#filters").innerHTML=h;
}
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
function render(){
  renderFilters();
  $("#count").textContent=notes.length?`${notes.length} ${notes.length===1?"nota":"notas"} · ${fmt(notes.reduce((a,n)=>a+n.duration,0))} en total`:"Graba una idea en un toque";
  let list=notes.slice().sort((a,b)=>b.created-a.created);
  if(filter!=="all") list=list.filter(n=>filter===""?!tags.some(t=>t.id===n.tag):n.tag===filter);
  if(query){const q=slug(query).replace(/-/g," ");list=list.filter(n=>slug(n.title||"").replace(/-/g," ").includes(q)||slug(tagOf(n.tag).name).includes(q));}
  if(!list.length){
    $("#list").innerHTML=notes.length?`<div class="empty-state"><div class="big">🔎</div>No hay notas con este filtro.</div>`
      :`<div class="empty-state"><div class="big">🎙️</div><b>Aún no hay notas.</b><br>Toca el botón rojo, habla y elige una etiqueta.</div>`;
    return;
  }
  let h="",last="";
  for(const n of list){
    const d=dayLabel(n.created);if(d!==last){h+=`<div class="day">${d}</div>`;last=d;}
    const t=tagOf(n.tag),isP=player.id===n.id&&!audio.paused;
    h+=`<div class="note ${player.id===n.id?"playing":""}" style="--c:${t.color}" data-id="${n.id}">
      <button class="play" data-act="play" aria-label="Reproducir">${isP?ICON_PAUSE:ICON_PLAY}</button>
      <div class="meta">
        <div class="title ${n.title?"":"empty"}">${n.title?esc(n.title):"Nota sin título"}</div>
        <div class="info"><span class="tagpill">${esc(t.name)}</span><span>${hhmm(n.created)}</span><span class="dur">${fmt(n.duration)}</span></div>
      </div>
      <button class="more" data-act="more" aria-label="Opciones"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="bar" data-act="seek"><i></i></div>
    </div>`;
  }
  $("#list").innerHTML=h;
}
$("#filters").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;render();};
$("#q").oninput=e=>{query=e.target.value.trim();render();};

/* ---------- playback ---------- */
const audio=new Audio();audio.preload="auto";
const player={id:null,url:null};
function stopPlayer(){audio.pause();if(player.url)URL.revokeObjectURL(player.url);player.id=null;player.url=null;}
function blobOf(n){return new Blob([n.audio],{type:n.mime||"audio/mp4"});}
async function togglePlay(id){
  if(player.id===id){if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); render(); return;}
  stopPlayer();
  const n=notes.find(x=>x.id===id);if(!n)return;
  player.id=id;player.url=URL.createObjectURL(blobOf(n));audio.src=player.url;
  try{await audio.play();}catch(e){toast("No se pudo reproducir el audio");}
  render();
}
audio.onended=()=>{const id=player.id;stopPlayer();render();};
audio.onpause=audio.onplay=()=>render();
audio.ontimeupdate=()=>{
  const el=document.querySelector(`.note[data-id="${player.id}"]`);if(!el)return;
  const n=notes.find(x=>x.id===player.id);const dur=isFinite(audio.duration)&&audio.duration>0?audio.duration:(n?n.duration:1);
  el.querySelector(".bar i").style.width=Math.min(100,audio.currentTime/dur*100)+"%";
  el.querySelector(".dur").textContent=fmt(audio.currentTime)+" / "+fmt(dur);
};
$("#list").onclick=e=>{
  const b=e.target.closest("[data-act]");const card=e.target.closest(".note");if(!card)return;const id=card.dataset.id;
  if(!b){togglePlay(id);return;}
  if(b.dataset.act==="play") togglePlay(id);
  else if(b.dataset.act==="more"){editing=id;show("#menuSheet");}
  else if(b.dataset.act==="seek"&&player.id===id){
    const r=b.getBoundingClientRect();const n=notes.find(x=>x.id===id);
    const dur=isFinite(audio.duration)&&audio.duration>0?audio.duration:n.duration;
    audio.currentTime=Math.max(0,Math.min(dur,(e.clientX-r.left)/r.width*dur));
  }
};

/* ---------- recording ---------- */
let rec=null,stream=null,chunks=[],t0=0,tick=null,actx=null,analyser=null,raf=null,cancelled=false;
function pickMime(){
  if(!window.MediaRecorder) return null;
  for(const m of ["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/aac","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"])
    if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)) return m;
  return "";
}
async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    toast("Este navegador no permite grabar. Actualiza iOS o usa Safari.");return;
  }
  stopPlayer();render();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){toast("Sin permiso de micrófono. Actívalo en Ajustes › Safari › Micrófono.");return;}
  const mime=pickMime();
  try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}
  catch(e){rec=new MediaRecorder(stream);}
  chunks=[];cancelled=false;
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=onRecStop;
  rec.start(1000);
  t0=Date.now();$("#timer").textContent="0:00";$("#recLabel").textContent="Grabando";
  tick=setInterval(()=>{$("#timer").textContent=fmt((Date.now()-t0)/1000);},250);
  show("#recSheet");
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaStreamSource(stream);analyser=actx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);
    drawWave();
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(20);
}
const levels=[];
function drawWave(){
  const c=$("#wave"),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==w*dpr){c.width=w*dpr;c.height=h*dpr;}
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const buf=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(buf);
  let sum=0;for(const v of buf){const x=(v-128)/128;sum+=x*x;}
  levels.push(Math.min(1,Math.sqrt(sum/buf.length)*4));
  const bw=5,gap=3,n=Math.floor(w/(bw+gap));while(levels.length>n)levels.shift();
  g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--brand");
  levels.forEach((l,i)=>{const bh=Math.max(4,l*h);const x=w-(levels.length-i)*(bw+gap);g.beginPath();
    if(g.roundRect) g.roundRect(x,(h-bh)/2,bw,bh,2.5); else g.rect(x,(h-bh)/2,bw,bh); g.fill();});
  raf=requestAnimationFrame(drawWave);
}
function cleanupRec(){
  clearInterval(tick);cancelAnimationFrame(raf);levels.length=0;
  if(stream) stream.getTracks().forEach(t=>t.stop());stream=null;
  if(actx){actx.close().catch(()=>{});actx=null;}
}
function stopRec(cancel){
  if(!rec) return;cancelled=!!cancel;
  pending={duration:(Date.now()-t0)/1000};
  if(rec.state!=="inactive") rec.stop(); else onRecStop();
}
async function onRecStop(){
  const r=rec;rec=null;cleanupRec();
  if(cancelled){pending=null;hide();return;}
  const mime=(r&&r.mimeType)||(chunks[0]&&chunks[0].type)||"audio/mp4";
  const blob=new Blob(chunks,{type:mime});chunks=[];
  if(!blob.size||pending.duration<0.5){pending=null;hide();toast("Demasiado corta, no se ha guardado");return;}
  pending.mime=mime.split(";")[0];pending.audio=await blob.arrayBuffer();
  openSave(null);
}
$("#recBtn").onclick=startRec;
$("#stopBtn").onclick=()=>stopRec(false);
$("#cancelRec").onclick=()=>stopRec(true);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&rec) stopRec(false);});

/* ---------- save / edit ---------- */
let pickTag=null;
function renderTagPick(){
  $("#tagPick").innerHTML=tags.map(t=>`<button class="chip ${pickTag===t.id?"on":""}" style="--c:${t.color}" data-t="${t.id}"><span class="dot"></span>${esc(t.name)}</button>`).join("");
}
$("#tagPick").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;pickTag=b.dataset.t;renderTagPick();};
function openSave(id){
  editing=id;
  const n=id?notes.find(x=>x.id===id):null;
  pickTag=n?n.tag:(filter!=="all"&&filter?filter:(lastTag&&tags.some(t=>t.id===lastTag)?lastTag:(tags[0]&&tags[0].id)));
  $("#titleIn").value=n?(n.title||""):"";
  $("#saveTitle").textContent=n?"Editar nota":"Guardar nota · "+fmt(pending.duration);
  $("#saveCancel").textContent=n?"Cancelar":"Descartar";
  renderTagPick();show("#saveSheet");
}
$("#saveOk").onclick=async()=>{
  const title=$("#titleIn").value.trim();
  if(editing){
    const n=notes.find(x=>x.id===editing);n.tag=pickTag;n.title=title;await putNote(n);
  }else if(pending){
    const n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:Date.now(),duration:pending.duration,
      tag:pickTag,title,mime:pending.mime,audio:pending.audio};
    try{await putNote(n);notes.push(n);}catch(e){toast("No se pudo guardar: ¿memoria llena?");return;}
    lastTag=pickTag;kvSet("lastTag",lastTag);pending=null;toast("Nota guardada");
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }
  editing=null;$("#titleIn").blur();hide();render();
};
$("#saveCancel").onclick=()=>{
  if(!editing&&pending){if(!confirm("¿Descartar esta grabación?"))return;pending=null;}
  editing=null;$("#titleIn").blur();hide();
};
$("#titleIn").onkeydown=e=>{if(e.key==="Enter")$("#saveOk").click();};

/* ---------- menu ---------- */
$("#mEdit").onclick=()=>openSave(editing);
$("#mDel").onclick=async()=>{
  const id=editing;hide();if(!confirm("¿Borrar esta nota? No se puede deshacer."))return;
  if(player.id===id) stopPlayer();
  await delNote(id);notes=notes.filter(n=>n.id!==id);render();toast("Nota borrada");
};
$("#mShare").onclick=async()=>{
  const n=notes.find(x=>x.id===editing);hide();if(!n)return;
  const d=new Date(n.created);const name=`${d.toISOString().slice(0,10)}-${slug(n.title||tagOf(n.tag).name)}.${extFor(n.mime)}`;
  await shareOrDownload(new File([n.audio],name,{type:n.mime}),n.title||"Nota de voz");
};
async function shareOrDownload(file,title){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title});return true;}
    catch(e){if(e.name==="AbortError")return false;}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return true;
}

/* ---------- settings: tags ---------- */
let colorOpen=null;
function renderTagEdit(){
  $("#tagEdit").innerHTML=tags.map(t=>`<div class="tagrow" data-id="${t.id}">
    <button class="swatch" style="background:${t.color}" data-act="color" aria-label="Color"></button>
    <input type="text" class="field" value="${esc(t.name)}" maxlength="24" data-act="name">
    <button class="del" data-act="del" aria-label="Borrar etiqueta"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>${colorOpen===t.id?`<div class="colors" data-id="${t.id}">${PALETTE.map(c=>`<button style="background:${c}" data-c="${c}"></button>`).join("")}</div>`:""}`).join("");
}
async function saveTags(){await kvSet("tags",tags);render();}
$("#tagEdit").addEventListener("click",async e=>{
  const sw=e.target.closest("[data-c]");
  if(sw){const id=sw.parentNode.dataset.id;tags.find(t=>t.id===id).color=sw.dataset.c;colorOpen=null;renderTagEdit();saveTags();return;}
  const b=e.target.closest("[data-act]");if(!b)return;const id=b.closest(".tagrow").dataset.id;
  if(b.dataset.act==="color"){colorOpen=colorOpen===id?null:id;renderTagEdit();}
  if(b.dataset.act==="del"){
    const used=notes.filter(n=>n.tag===id).length;
    if(!confirm(used?`Hay ${used} nota(s) con esta etiqueta. Se quedarán «Sin etiqueta». ¿Borrarla?`:"¿Borrar esta etiqueta?"))return;
    tags=tags.filter(t=>t.id!==id);if(filter===id)filter="all";renderTagEdit();saveTags();
  }
});
$("#tagEdit").addEventListener("change",e=>{
  if(e.target.dataset.act!=="name")return;const id=e.target.closest(".tagrow").dataset.id;
  const v=e.target.value.trim();if(!v){renderTagEdit();return;}tags.find(t=>t.id===id).name=v;saveTags();
});
$("#addTag").onclick=()=>{
  const used=new Set(tags.map(t=>t.color));const color=PALETTE.find(c=>!used.has(c))||PALETTE[tags.length%PALETTE.length];
  const t={id:"t"+Date.now().toString(36),name:"Nueva",color};tags.push(t);renderTagEdit();saveTags();
  const inp=document.querySelector(`.tagrow[data-id="${t.id}"] input`);inp.focus();inp.select();
};
async function updateStat(){
  const bytes=notes.reduce((a,n)=>a+(n.audio?n.audio.byteLength:0),0);
  let s=`${notes.length} notas · ${(bytes/1048576).toFixed(1)} MB de audio.`;
  const lb=await kvGet("lastBackup");s+=lb?` Última copia: ${new Date(lb).toLocaleDateString("es-ES",{day:"numeric",month:"long"})}.`:" Aún no has hecho ninguna copia.";
  $("#stat").textContent=s;
}
$("#settingsBtn").onclick=()=>{colorOpen=null;renderTagEdit();updateStat();show("#setSheet");};
$("#setClose").onclick=()=>{document.activeElement&&document.activeElement.blur();hide();};

/* ---------- backup ---------- */
function abToB64(ab){const u=new Uint8Array(ab);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64ToAb(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
$("#exportBtn").onclick=async()=>{
  if(!notes.length){toast("No hay notas que copiar");return;}
  const data={app:"notas-voz",version:1,exported:new Date().toISOString(),tags,
    notes:notes.map(n=>({id:n.id,created:n.created,duration:n.duration,tag:n.tag,title:n.title,mime:n.mime,audio:abToB64(n.audio)}))};
  const file=new File([JSON.stringify(data)],`notas-voz-copia-${new Date().toISOString().slice(0,10)}.json`,{type:"application/json"});
  const ok=await shareOrDownload(file,"Copia de Notas de voz");
  if(ok){await kvSet("lastBackup",Date.now());updateStat();toast("Copia lista. Guárdala en Archivos o Drive.");}
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let data;try{data=JSON.parse(await f.text());}catch(err){toast("Ese archivo no es una copia válida");return;}
  if(!data||data.app!=="notas-voz"||!Array.isArray(data.notes)){toast("Ese archivo no es una copia de Notas de voz");return;}
  let added=0;
  for(const t of data.tags||[]) if(!tags.some(x=>x.id===t.id)) tags.push(t);
  await kvSet("tags",tags);
  for(const n of data.notes){
    if(notes.some(x=>x.id===n.id)) continue;
    const note={...n,audio:b64ToAb(n.audio)};await putNote(note);notes.push(note);added++;
  }
  render();renderTagEdit();updateStat();
  toast(added?`Restauradas ${added} notas`:"Todas las notas de la copia ya estaban aquí");
};

/* ---------- init ---------- */
(async()=>{
  try{
    tags=(await kvGet("tags"))||DEFAULT_TAGS.slice();
    lastTag=await kvGet("lastTag");
    notes=(await getAll())||[];
  }catch(e){toast("No se pudo abrir el almacenamiento");tags=DEFAULT_TAGS.slice();}
  render();
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
</script>
