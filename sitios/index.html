*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff}
body{font-family:'SG',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.serif{font-family:'IS',Georgia,serif;font-style:italic;font-weight:400}
section{position:fixed;inset:0;display:none;flex-direction:column;background:#000}
section.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:120px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(env(safe-area-inset-top) + 18px) 18px 16px}
.hd h1{font:400 42px/1 'IS',Georgia,serif;font-style:italic}
.hd .k{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;padding-bottom:7px}
.hd .x{font-size:22px;opacity:.7;padding:0 4px 4px;background:none;border:0;color:#fff}
/* franjas */
.cv{position:relative;overflow:hidden;background:#151515 center/cover no-repeat;display:block;width:100%;border:0;color:#fff;text-align:left}
.cv::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.05) 80%)}
.cv h2{position:absolute;left:16px;bottom:10px;font:400 40px/0.95 'IS',Georgia,serif;font-style:italic;z-index:2;right:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .c{position:absolute;right:14px;bottom:14px;z-index:2;font-weight:700;font-size:12px;border:1.5px solid #fff;padding:4px 9px;border-radius:99px}
.cv.empty{background:linear-gradient(110deg,#141414,#262626)}
.cv.empty h2{opacity:.55}
.cv.empty .c{opacity:.5}
.list{display:flex;flex-direction:column;gap:3px}
.list .cv{height:104px}
/* barra */
.bar{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:10px;background:linear-gradient(transparent,#000 30%);z-index:10}
.bar button{flex:1;height:58px;border-radius:99px;border:0;font:400 24px 'IS',Georgia,serif;font-style:italic;display:flex;align-items:center;justify-content:center;gap:8px}
.b1{background:#fff;color:#000}
.b2{background:#1a1a1a;color:#fff}
.b2:disabled,.b1:disabled{opacity:.35}
/* radar */
#radar .wrap{position:relative;margin:4px auto 0;width:min(92vw,400px);aspect-ratio:1}
#radar svg{width:100%;height:100%;display:block;overflow:visible}
.sweep{transform-origin:50% 50%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.near{margin:14px 16px 0;display:flex;flex-direction:column;gap:3px;border-radius:22px;overflow:hidden}
.near .cv{height:76px}
.near .cv h2{font-size:30px;bottom:8px}
.near .cv .c{border:0;background:#fff;color:#000}
.msg{margin:14px 22px 0;color:#9a9a9a;font-size:15px;line-height:1.4;text-align:center}
.msg b{color:#fff}
/* categoria */
.top{height:230px;flex:none}
.top h2{font-size:64px;bottom:16px}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px;z-index:5;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);border:0;color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.tr{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:14px;z-index:5;background:rgba(0,0,0,.5);border:0;color:#fff;font:700 12px 'SG';letter-spacing:.14em;text-transform:uppercase;padding:9px 13px;border-radius:99px}
.rows{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:14px;align-items:center;background:none;border:0;color:#fff;text-align:left;width:100%}
.row .ph{width:78px;height:78px;border-radius:16px;flex:none;background:#1a1a1a center/cover}
.row .t{flex:1;min-width:0}
.row b{display:block;font:400 26px/1.05 'IS',Georgia,serif;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row i{display:block;font-style:normal;font-size:13.5px;color:#9a9a9a;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-weight:700;font-size:12px;color:#777;white-space:nowrap;align-self:flex-start;padding-top:6px}
.none{color:#777;font-size:15px;padding:20px 4px;line-height:1.4}
.catedit{padding:4px 16px 0;display:none;gap:8px;flex-direction:column}
.catedit.on{display:flex}
/* ficha */
.ftop{height:min(52vh,440px);flex:none}
.ftop::before{background:linear-gradient(0deg,#000 0%,rgba(0,0,0,0) 45%)}
.ftop h2{font-size:56px;left:20px;bottom:4px;white-space:normal;right:20px}
.fi{padding:8px 20px 0}
.tag{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#aaa}
.nota{font-size:17px;line-height:1.45;margin-top:12px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.ll{margin-top:18px;padding-top:14px;border-top:1px solid #222;font-size:15px;color:#bbb;line-height:1.4;white-space:pre-wrap}
.ll b{display:block;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin-bottom:4px}
/* formulario */
.form{padding:0 16px;display:flex;flex-direction:column;gap:18px}
.pic{height:230px;border-radius:24px;border:1.5px dashed #444;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#aaa;background:#000 center/cover no-repeat;position:relative;overflow:hidden}
.pic span{font:400 30px 'IS',Georgia,serif;font-style:italic;color:#fff}
.pic.has{border:0}
.pic.has>*{display:none}
.pic.has::after{content:"cambiar foto";position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);font-size:13px;font-weight:700;padding:6px 11px;border-radius:99px;color:#fff}
label.l{display:block;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin-bottom:8px}
.in{width:100%;background:#141414;border:0;border-radius:16px;padding:14px 16px;font:500 17px 'SG',system-ui;color:#fff;outline:none;resize:none}
.in::placeholder{color:#5a5a5a}
textarea.in{min-height:84px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:9px 15px;border-radius:99px;background:#141414;border:0;color:#fff;font:400 20px 'IS',Georgia,serif;font-style:italic}
.chips button.on{background:#fff;color:#000}
.newcat{display:none;gap:8px;margin-top:10px}
.newcat.on{display:flex}
.newcat .in{flex:1}
.mini{background:#fff;color:#000;border:0;border-radius:14px;padding:0 18px;font-weight:700;font-size:15px}
.gps{display:flex;align-items:center;gap:10px;background:#141414;border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.3}
.gps i{width:10px;height:10px;border-radius:50%;background:#555;flex:none}
.gps i.ok{background:#3cff7a}.gps i.wait{background:#ffd23f;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
.gps .s{flex:1}
.gps button{background:none;border:0;color:#fff;font-weight:700;font-size:13px;text-decoration:underline;white-space:nowrap}
.del{background:none;border:1.5px solid #3a1a1a;color:#ff6b6b;border-radius:16px;padding:14px;font:700 15px 'SG';margin-top:6px}
/* copia */
.copia{padding:0 18px;display:flex;flex-direction:column;gap:12px}
.copia p{color:#9a9a9a;font-size:15px;line-height:1.45}
.big{height:58px;border-radius:18px;border:0;font:700 16px 'SG';background:#1a1a1a;color:#fff}
.big.w{background:#fff;color:#000}
.foot{display:block;margin:22px auto 0;background:none;border:0;color:#666;font:700 12px 'SG';letter-spacing:.16em;text-transform:uppercase;padding:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head><body>

  <button class="back" data-back>‹</button>
  <div class="fi">
   <div class="tag" id="ftag"></div>
   <div class="nota" id="fnota"></div>
   <div class="ll" id="fll"></div>
  </div>
 </div>
 <div class="bar"><button class="b1" id="fgo">Cómo llegar</button><button class="b2" id="fedit">Editar</button></div>
</section>

<!-- NUEVO / EDITAR -->
<section id="nuevo">
 <div class="scroll">
  <div class="hd"><h1 id="ntitle">Un sitio nuevo</h1><button class="x" data-back>✕</button></div>
  <div class="form">
   <label class="pic" id="npic">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="4"/><path d="M8 6l2-3h4l2 3"/></svg>
    <span>Hacer foto</span><em style="font-style:normal">o elegir de la galería</em>
    <input type="file" accept="image/*" id="nfile" hidden>
   </label>
   <div><label class="l">Nombre</label><input class="in" id="nname" maxlength="60" placeholder="Pescado de Fatu"></div>
   <div><label class="l">Categoría</label><div class="chips" id="nchips"></div>
    <div class="newcat" id="newcat"><input class="in" id="ncat" maxlength="24" placeholder="Nueva categoría"><button class="mini" id="ncatok">OK</button></div></div>
   <div><label class="l">Nota</label><textarea class="in" id="nnota" placeholder="Qué pedir, precio, horario…"></textarea></div>
   <div><label class="l">Cómo llegar</label><textarea class="in" id="nllegar" placeholder="Detrás de la farmacia, puerta verde…" style="min-height:60px"></textarea></div>
   <div class="gps"><i id="ngi"></i><span class="s" id="ngs"></span><button id="ngb"></button></div>
   <button class="del" id="ndel" hidden>Borrar este sitio</button>
  </div>
 </div>
 <div class="bar"><button class="b1" id="nsave">Guardar</button></div>
</section>

<!-- COPIA -->
<section id="copia">
 <div class="scroll">
  <div class="hd"><h1>Copia</h1><button class="x" data-back>✕</button></div>
  <div class="copia">
   <p>Tus sitios se guardan solo en este móvil. Si borras la app o los datos de Safari, se pierden. Haz una copia de vez en cuando y guárdala en Archivos, en el correo o en Drive.</p>
   <button class="big w" id="exp">Hacer copia (archivo)</button>
   <button class="big" id="imp">Recuperar una copia</button>
   <input type="file" accept=".json,application/json" id="impf" hidden>
   <p id="cinfo"></p>
   <p style="color:#555;font-size:13px">Versión 1</p>
  </div>
 </div>
</section>

<div class="toast" id="toast"></div>

<script>
const VER="1";
const $=s=>document.querySelector(s);
const PAL=['#ff7a2e','#ffd23f','#6bc7ff','#3cff7a','#c58cff','#ff6b8a','#ffffff','#7ae0d0'];
const DEF_CATS=['Comer','Telas','Rincones','Súper','Arreglos'];
let db,sitios=[],cats=[],pos=null,stack=['radar'],curCat=null,curId=null,edit=null,urls={},range=null;

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((ok,ko)=>{const r=indexedDB.open('mis-sitios',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('sitios',{keyPath:'id'});d.createObjectStore('kv');};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});}
function tx(st,mode,fn){return new Promise((ok,ko)=>{const t=db.transaction(st,mode);const s=t.objectStore(st);const res=fn(s);t.oncomplete=()=>ok(res&&res.result);t.onerror=()=>ko(t.error);});}
const getAll=()=>tx('sitios','readonly',s=>s.getAll());
const putS=o=>tx('sitios','readwrite',s=>s.put(o));
const delS=id=>tx('sitios','readwrite',s=>s.delete(id));
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));

/* ---------- utilidades ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}
function fecha(ts){const d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function photoURL(s){if(!s||!s.foto)return null;if(!urls[s.id])urls[s.id]=URL.createObjectURL(new Blob([s.foto],{type:'image/jpeg'}));return urls[s.id];}
function dropURL(id){if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id];}}
function bg(el,s){const u=photoURL(s);el.style.backgroundImage=u?`url("${u}")`:'';}
function dist(a,b){const R=6371000,r=Math.PI/180;const dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
 const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function bearing(a,b){const r=Math.PI/180;const y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r);
 const x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);return (Math.atan2(y,x)/r+360)%360;}
const ARR=['↑','↗','→','↘','↓','↙','←','↖'];
const arrow=b=>ARR[Math.round(b/45)%8];
function fmtD(m){return m<1000?Math.round(m/10)*10+' m':(m<10000?(m/1000).toFixed(1).replace('.',','):Math.round(m/1000))+' km';}
function catColor(c){const i=cats.indexOf(c);return PAL[(i<0?0:i)%PAL.length];}
function inCat(c){return sitios.filter(s=>s.cat===c).sort((a,b)=>b.fecha-a.fecha);}

/* ---------- navegación ---------- */
function show(id,push=true){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));
 if(push){if(['radar','sitios'].includes(id))stack=[id];else stack.push(id);}
 const sc=$('#'+id+' .scroll');if(sc&&push)sc.scrollTop=0;
 if(id==='radar'){renderRadar();watchGPS(true);} else if(id!=='nuevo')watchGPS(false);
}
function back(){stack.pop();const id=stack[stack.length-1]||'radar';
 if(id==='cat')renderCat();if(id==='ficha')renderFicha();if(id==='sitios')renderCats();
 show(id,false);if(id==='radar'){renderRadar();watchGPS(true);}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){const t=g.dataset.go;
  if(t==='nuevo')openForm(null);else{if(t==='sitios')renderCats();if(t==='copia')renderCopia();show(t);}return;}
 if(e.target.closest('[data-back]'))back();});

/* ---------- GPS ---------- */
let watchId=null,gpsErr=null;
function watchGPS(on){
 if(on&&watchId===null&&'geolocation' in navigator){
  watchId=navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};gpsErr=null;
    if($('#radar').classList.contains('on'))renderRadar();if($('#nuevo').classList.contains('on'))gpsForm();},
   err=>{gpsErr=err.code;if($('#radar').classList.contains('on'))renderRadar();if($('#nuevo').classList.contains('on'))gpsForm();},
   {enableHighAccuracy:true,maximumAge:15000,timeout:20000});
 } else if(!on&&watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
}

/* ---------- radar ---------- */
const RANGES=[100,250,500,1000,2500,5000,10000,25000,100000];
function renderRadar(){
 const svg=$('#rsvg'),C=180,R=170;
 const geo=sitios.filter(s=>s.lat!=null);
 let near=[];
 if(pos)near=geo.map(s=>({s,d:dist(pos,s),b:bearing(pos,s)})).sort((a,b)=>a.d-b.d);
 if(pos&&range===null){const ref=near[Math.min(1,near.length-1)];const need=ref?ref.d*1.1:500;range=RANGES.find(r=>r>=need)||RANGES[RANGES.length-1];if(range<250)range=250;}
 const rg=range||1000;
 let h=`<defs><radialGradient id="sw" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
 <g fill="none" stroke="#2a2a2a" stroke-width="1.2"><circle cx="${C}" cy="${C}" r="${R}"/><circle cx="${C}" cy="${C}" r="${R*2/3}"/><circle cx="${C}" cy="${C}" r="${R/3}"/><path d="M${C} 10v340M10 ${C}h340"/></g>
 <g class="sweep"><path d="M${C} ${C}L${C} 10A170 170 0 0 1 300 60z" fill="url(#sw)"/></g>
 <g font-family="SG" font-size="10" fill="#666" font-weight="700"><text x="${C+6}" y="24">N</text><text x="${C+R*2/3-30}" y="${C-5}">${fmtD(rg*2/3)}</text><text x="${C+R-34}" y="${C-5}">${fmtD(rg)}</text></g>`;
 let out=0;const dots=[];
 near.forEach((n,i)=>{if(n.d>rg){out++;return;}const rr=n.d/rg*R,a=n.b*Math.PI/180;
  dots.push({x:C+rr*Math.sin(a),y:C-rr*Math.cos(a),n,i});});
 dots.reverse().forEach(({x,y,n,i})=>{const s=n.s,u=photoURL(s),r=i<4?17:11,col=catColor(s.cat);
  h+=`<g data-id="${s.id}">`;
  if(u)h+=`<clipPath id="cp${i}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath><image href="${u}" x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})"/>`;
  else h+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`;
  h+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${col}" stroke-width="3"/>`;
  if(i<5){const right=x<C+40;const nm=s.nombre.length>16?s.nombre.slice(0,15)+'…':s.nombre;
   h+=`<text x="${right?x+r+6:x-r-6}" y="${y+6}" text-anchor="${right?'start':'end'}" font-family="IS" font-style="italic" font-size="19" fill="#fff" style="paint-order:stroke" stroke="#000" stroke-width="4">${esc(nm)}</text>`;}
  h+=`</g>`;});
 h+=`<circle cx="${C}" cy="${C}" r="7" fill="#fff"/><circle cx="${C}" cy="${C}" r="16" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`;
 svg.innerHTML=h;
 const m=$('#rmsg');
 if(!sitios.length)m.innerHTML='Aún no tienes sitios. Toca <b>+ un sitio</b> cuando estés en uno que te guste: se guarda dónde estás.';
 else if(!pos)m.innerHTML=gpsErr===1?'Sin permiso de ubicación. Actívalo en Ajustes › Privacidad › Localización para ver qué hay cerca.':'Buscando dónde estás…';
 else if(!geo.length)m.innerHTML='Ninguno de tus sitios tiene ubicación guardada.';
 else m.innerHTML=(out?`${out} ${out===1?'sitio queda':'sitios quedan'} fuera del radar. `:'')+'Toca el radar para acercar o alejar.';
 const nr=$('#near');nr.innerHTML='';
 const list=pos&&near.length?near.slice(0,2):sitios.slice().sort((a,b)=>b.fecha-a.fecha).slice(0,2).map(s=>({s}));
 list.forEach(n=>{const b=document.createElement('button');b.className='cv';bg(b,n.s);
  b.innerHTML=`<h2>${esc(n.s.nombre)}</h2>`+(n.d!=null?`<span class="c">${fmtD(n.d)} ${arrow(n.b)}</span>`:`<span class="c">${fecha(n.s.fecha)}</span>`);
  b.onclick=()=>openFicha(n.s.id);nr.appendChild(b);});
}
$('#rwrap').addEventListener('click',e=>{const g=e.target.closest('g[data-id]');if(g){openFicha(g.dataset.id);return;}
 if(!pos)return;const i=RANGES.indexOf(range);range=RANGES[(i+1)%RANGES.length];if(range<250)range=250;renderRadar();toast('Radar: '+fmtD(range));});

/* ---------- categorías ---------- */
function renderCats(){const box=$('#cats');box.innerHTML='';
 cats.forEach(c=>{const l=inCat(c);const b=document.createElement('button');b.className='cv'+(l.length?'':' empty');
  const withPic=l.find(s=>s.foto);if(withPic)bg(b,withPic);
  b.innerHTML=`<h2>${esc(c)}</h2><span class="c">${l.length}</span>`;b.onclick=()=>{curCat=c;$('#catedit').classList.remove('on');renderCat();show('cat');};box.appendChild(b);});
 const sin=sitios.filter(s=>!cats.includes(s.cat));
 if(sin.length){const b=document.createElement('button');b.className='cv';b.innerHTML=`<h2>Sin categoría</h2><span class="c">${sin.length}</span>`;b.onclick=()=>{curCat=null;renderCat();show('cat');};box.appendChild(b);}
}
function renderCat(){const l=curCat===null?sitios.filter(s=>!cats.includes(s.cat)):inCat(curCat);
 const top=$('#ctop');const wp=l.find(s=>s.foto);top.style.backgroundImage='';if(wp)bg(top,wp);top.classList.toggle('empty',!wp);
 $('#cname').textContent=curCat===null?'Sin categoría':curCat;$('#ccount').textContent=l.length;$('#cedit').hidden=curCat===null;
 const r=$('#rows');r.innerHTML='';
 if(!l.length)r.innerHTML='<div class="none">Todavía no hay sitios aquí. Toca <b style="color:#fff">+ un sitio</b> para guardar el primero.</div>';
 l.forEach(s=>{const b=document.createElement('button');b.className='row';
  b.innerHTML=`<div class="ph"></div><div class="t"><b>${esc(s.nombre)}</b><i>${esc((s.nota||s.llegar||'').split('\n')[0])}</i></div><span class="d">${fecha(s.fecha)}</span>`;
  bg(b.firstChild,s);b.onclick=()=>openFicha(s.id);r.appendChild(b);});
}
$('#cedit').onclick=()=>{const e=$('#catedit');e.classList.toggle('on');$('#crename').value=curCat;$('#cdel').textContent='Borrar categoría';};
$('#crsave').onclick=async()=>{const n=$('#crename').value.trim();if(!n||n===curCat){$('#catedit').classList.remove('on');return;}
 if(cats.includes(n)){toast('Ya existe');return;}
 const old=curCat;cats[cats.indexOf(old)]=n;await kvSet('cats',cats);
 for(const s of sitios.filter(s=>s.cat===old)){s.cat=n;await putS(s);}
 curCat=n;$('#catedit').classList.remove('on');renderCat();toast('Cambiado');};
$('#cdel').onclick=async()=>{if(inCat(curCat).length){toast('Primero mueve o borra sus sitios');return;}
 const b=$('#cdel');if(b.textContent!=='Toca otra vez para borrar'){b.textContent='Toca otra vez para borrar';return;}
 cats=cats.filter(c=>c!==curCat);await kvSet('cats',cats);renderCats();back();};
$('#caddhere').onclick=()=>openForm(null,curCat);

/* ---------- ficha ---------- */
function openFicha(id){curId=id;renderFicha();show('ficha');}
function renderFicha(){const s=sitios.find(x=>x.id===curId);if(!s)return;
 const t=$('#ftop');t.style.backgroundImage='';bg(t,s);t.classList.toggle('empty',!s.foto);
 $('#fname').textContent=s.nombre;
 $('#ftag').textContent=(s.cat||'Sin categoría')+' · '+fecha(s.fecha);
 $('#fnota').textContent=s.nota||'';
 let ll=s.llegar||'';
 if(pos&&s.lat!=null){const d=dist(pos,s);ll+=(ll?'\n':'')+fmtD(d)+' de aquí '+arrow(bearing(pos,s));}
 $('#fll').innerHTML=ll?'<b>Cómo llegar</b>'+esc(ll):'';$('#fll').style.display=ll?'':'none';
 $('#fgo').disabled=s.lat==null;
}
$('#fgo').onclick=()=>{const s=sitios.find(x=>x.id===curId);if(!s||s.lat==null)return;
 location.href=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;};
$('#fedit').onclick=()=>openForm(curId);

/* ---------- formulario ---------- */
function openForm(id,cat){const s=id?sitios.find(x=>x.id===id):null;
 edit={id:s?s.id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),isNew:!s,foto:s?s.foto:null,
  cat:s?s.cat:(cat||curCat||cats[0]),lat:s?s.lat:null,lng:s?s.lng:null,useGPS:!s,fecha:s?s.fecha:Date.now()};
 $('#ntitle').textContent=s?'Editar sitio':'Un sitio nuevo';
 $('#nname').value=s?s.nombre:'';$('#nnota').value=s?s.nota||'':'';$('#nllegar').value=s?s.llegar||'':'';
 $('#ndel').hidden=!s;$('#ndel').textContent='Borrar este sitio';
 $('#newcat').classList.remove('on');
 picPreview();renderChips();gpsForm();show('nuevo');watchGPS(true);}
function picPreview(){const p=$('#npic');if(edit.foto){if(edit._u)URL.revokeObjectURL(edit._u);edit._u=URL.createObjectURL(new Blob([edit.foto],{type:'image/jpeg'}));p.style.backgroundImage=`url("${edit._u}")`;p.classList.add('has');}
 else{p.style.backgroundImage='';p.classList.remove('has');}}
function renderChips(){const c=$('#nchips');c.innerHTML='';
 cats.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===edit.cat?'on':'';b.onclick=()=>{edit.cat=k;renderChips();};c.appendChild(b);});
 const p=document.createElement('button');p.textContent='+';p.onclick=()=>{$('#newcat').classList.add('on');$('#ncat').focus();};c.appendChild(p);}
$('#ncatok').onclick=async()=>{const n=$('#ncat').value.trim();if(!n)return;if(!cats.includes(n)){cats.push(n);await kvSet('cats',cats);}
 edit.cat=n;$('#ncat').value='';$('#newcat').classList.remove('on');renderChips();};
function gpsForm(){if(!edit)return;const i=$('#ngi'),s=$('#ngs'),b=$('#ngb');
 if(edit.useGPS){
  if(pos){edit.lat=pos.lat;edit.lng=pos.lng;i.className='ok';s.textContent='Ubicación: estás aquí (±'+Math.round(pos.acc)+' m)';}
  else if(gpsErr===1){i.className='';s.textContent='Sin permiso de ubicación';}
  else{i.className='wait';s.textContent='Buscando dónde estás…';}
  b.textContent='Sin ubicación';b.onclick=()=>{edit.useGPS=false;edit.lat=null;edit.lng=null;gpsForm();};
 }else{
  i.className=edit.lat!=null?'ok':'';s.textContent=edit.lat!=null?'Ubicación guardada':'Sin ubicación';
  b.textContent=edit.lat!=null?'Usar dónde estoy':'Guardar dónde estoy';b.onclick=()=>{edit.useGPS=true;gpsForm();};
 }}
$('#nfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{edit.foto=await shrink(f);picPreview();}catch(err){toast('No se pudo leer la foto');}};
function shrink(file){return new Promise((ok,ko)=>{const img=new Image();const u=URL.createObjectURL(file);
 img.onload=()=>{const M=1280;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
  c.toBlob(b=>b?b.arrayBuffer().then(ok):ko(),'image/jpeg',0.8);};
 img.onerror=()=>{URL.revokeObjectURL(u);ko();};img.src=u;});}
$('#nsave').onclick=async()=>{const nombre=$('#nname').value.trim();if(!nombre){toast('Ponle un nombre');$('#nname').focus();return;}
 if(edit.useGPS&&!pos&&gpsErr!==1){toast('Aún buscando ubicación…');return;}
 const s={id:edit.id,nombre,cat:edit.cat,nota:$('#nnota').value.trim(),llegar:$('#nllegar').value.trim(),foto:edit.foto,
  lat:edit.lat,lng:edit.lng,fecha:edit.fecha};
 await putS(s);dropURL(s.id);const i=sitios.findIndex(x=>x.id===s.id);if(i<0)sitios.push(s);else sitios[i]=s;
 const wasNew=edit.isNew;edit=null;toast(wasNew?'Guardado':'Cambios guardados');range=null;
 if(wasNew){curId=s.id;stack=['sitios'];curCat=s.cat;renderCats();stack.push('cat');renderCat();renderFicha();show('ficha');}
 else back();};
$('#ndel').onclick=async()=>{const b=$('#ndel');if(b.textContent!=='Toca otra vez para borrar'){b.textContent='Toca otra vez para borrar';return;}
 await delS(edit.id);dropURL(edit.id);sitios=sitios.filter(x=>x.id!==edit.id);edit=null;toast('Borrado');
 stack=stack.filter(x=>x!=='ficha'&&x!=='nuevo');const id=stack[stack.length-1]||'radar';if(id==='cat')renderCat();if(id==='sitios')renderCats();show(id,false);if(id==='radar')renderRadar();};

/* ---------- copia ---------- */
async function renderCopia(){const t=await kvGet('lastBackup');
 $('#cinfo').textContent=sitios.length+' sitios guardados. '+(t?'Última copia: '+fecha(t)+'.':'Aún no has hecho ninguna copia.');}
function b64(buf){let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}
function unb64(t){const s=atob(t);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer;}
$('#exp').onclick=async()=>{const data={app:'mis-sitios',v:1,cats,sitios:sitios.map(s=>({...s,foto:s.foto?b64(s.foto):null}))};
 const d=new Date();const name=`mis-sitios-${d.getDate()}-${d.getMonth()+1}-${String(d.getFullYear()).slice(2)}.json`;
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const file=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  await kvSet('lastBackup',Date.now());renderCopia();toast('Copia hecha');}catch(e){if(e&&e.name!=='AbortError')toast('No se pudo hacer la copia');}};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(d.app!=='mis-sitios')throw 0;let n=0;
  for(const c of d.cats||[])if(!cats.includes(c))cats.push(c);await kvSet('cats',cats);
  for(const s of d.sitios||[]){const o={...s,foto:s.foto?unb64(s.foto):null};await putS(o);dropURL(o.id);
   const i=sitios.findIndex(x=>x.id===o.id);if(i<0){sitios.push(o);n++;}else sitios[i]=o;}
  renderCopia();range=null;toast(n+' sitios recuperados');}catch(err){toast('Ese archivo no es una copia válida');}};

(async()=>{try{db=await openDB();sitios=await getAll()||[];cats=await kvGet('cats');
 if(!cats){cats=DEF_CATS.slice();await kvSet('cats',cats);}}catch(e){toast('No se pudo abrir el almacenamiento');cats=DEF_CATS.slice();}
 renderRadar();watchGPS(true);})();
