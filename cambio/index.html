:root{--lime:#c6ff00;--key:#161616;--keyon:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#000;color:#fff;overscroll-behavior:none}
body{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500;display:flex;flex-direction:column;height:100dvh;
 padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden;touch-action:manipulation}
.top{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6px 22px;min-height:0}
.lbl{font-size:13px;letter-spacing:.18em;font-weight:700;color:var(--lime)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
.xof{font-size:40px;font-weight:500;white-space:nowrap;min-width:0}
.clr{flex:none;height:40px;padding:0 16px 0 12px;border-radius:99px;border:0;background:var(--key);color:var(--lime);
 font:700 14px 'Space Grotesk',sans-serif;letter-spacing:.06em;display:flex;align-items:center;gap:6px;
 transition:opacity .2s,transform .2s;cursor:pointer}
.clr svg{width:16px;height:16px}
.clr.off{opacity:0;transform:scale(.8);pointer-events:none}
.clr:active{background:var(--keyon)}
.eur{font-family:'Archivo Black',sans-serif;color:var(--lime);line-height:.95;white-space:nowrap;font-size:92px}
.eur small{font-size:.5em}
.zero .eur,.zero .xof{opacity:.35}
.rate{font-size:12px;margin-top:14px;opacity:.6}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{height:min(74px,9.2dvh);display:flex;align-items:center;justify-content:center;font:500 30px 'Space Grotesk',sans-serif;
 background:var(--key);border-radius:22px;color:#fff;border:0;cursor:pointer;transition:transform .08s,background .08s}
.k.on{background:var(--keyon);transform:scale(.95)}
.k.s{background:var(--lime);color:#000}
.k.s.on{background:#a8d900}
.k svg{width:30px;height:30px}
</style></head><body class="zero">
<div class="top">
 <div class="lbl">XOF</div>
 <div class="row"><div class="xof" id="x">0</div>
  <button class="clr off" id="c" aria-label="Borrar todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>BORRAR</button></div>
 <div class="lbl">EUROS</div>
 <div class="eur" id="e">0,00<small> €</small></div>
 <div class="rate">1 € = 655,957 XOF</div>
</div>
<div class="pad" id="p">
 <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button>
 <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button>
 <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button>
 <button class="k" data-k="000">000</button><button class="k" data-k="0">0</button>
 <button class="k s" data-k="del" aria-label="Borrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l6 6M18 9l-6 6"/></svg></button>
</div>
<script>
const RATE=655.957,MAX=12;
let v="";
const $x=document.getElementById("x"),$e=document.getElementById("e"),$c=document.getElementById("c"),top_=document.querySelector(".top");
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g," ");
function fit(el,max,w){el.style.fontSize=max+"px";let f=max;while(el.scrollWidth>w&&f>24){f-=2;el.style.fontSize=f+"px";}}
function draw(){
 const n=v?parseInt(v,10):0;
 const c=Math.round(n/RATE*100);
 const ent=String(Math.floor(c/100)),dec=String(c%100).padStart(2,"0");
 $x.textContent=grp(String(n));
 $e.innerHTML=grp(ent)+","+dec+"<small> €</small>";
 document.body.classList.toggle("zero",!n);
 $c.classList.toggle("off",!n);
 fit($e,92,top_.clientWidth-12);fit($x,40,top_.clientWidth-12-(n?$c.offsetWidth+12:0));
}
function press(k){
 if(k==="del")v=v.slice(0,-1);
 else if(k==="clr")v="";
 else{ if(!v&&k[0]==="0")return; v=(v+k).slice(0,MAX); }
 draw();
}
let hold;
document.getElementById("p").addEventListener("pointerdown",ev=>{
 const b=ev.target.closest(".k");if(!b)return;ev.preventDefault();
 b.classList.add("on");setTimeout(()=>b.classList.remove("on"),110);
 press(b.dataset.k);
 if(b.dataset.k==="del"){clearTimeout(hold);hold=setTimeout(()=>press("clr"),550);}
});
["pointerup","pointercancel","pointerleave"].forEach(t=>document.addEventListener(t,()=>clearTimeout(hold)));
$c.addEventListener("click",()=>press("clr"));
document.addEventListener("keydown",ev=>{
 if(/^\d$/.test(ev.key))press(ev.key);
 else if(ev.key==="Backspace")press("del");
 else if(ev.key==="Escape"||ev.key==="Delete")press("clr");
});
window.addEventListener("resize",draw);
document.fonts&&document.fonts.ready.then(draw);
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
